name: Sunricher 10 Button Remote (SR-ZG2856-Pro)
service: Zigbee2MQTT
event_type: mqtt
mqtt_topic_format: zigbee2mqtt/+
info: |
    Sunricher SR-ZG2856-Pro 10-button remote / wall switch.

    IMPORTANT: this blueprint listens on the device's MAIN topic (e.g. zigbee2mqtt/<friendly_name>),
    NOT the /action sub-topic. The button identity is published only in the "action_buttons" field of
    the full JSON payload, so the main topic is required. When configuring the switch, set the
    identifier to the main topic (zigbee2mqtt/<friendly_name>) WITHOUT /action.

    Each button supports: press (short_press), press 2x (double_press), hold and hold (released).

    BUTTON MAPPING (5 rows, left = odd, right = even):
      Left column:  k1  k3  k5  k7  k9
      Right column: k2  k4  k6  k8  k10
    Not every key/action combination has been verified on a real device yet. Check the mapping with
    the live monitor (press a key and see which box lights up); if your firmware numbers the keys
    differently, swap the action_buttons.0 values below.
buttons:
  - x: 17   # k1
    y: 9
    width: 82
    height: 62
    actions:
      - title: press
        conditions:
          - key: action
            value: short_press
          - key: action_buttons.0
            value: k1
      - title: press 2x
        conditions:
          - key: action
            value: double_press
          - key: action_buttons.0
            value: k1
      - title: hold
        conditions:
          - key: action
            value: hold
          - key: action_buttons.0
            value: k1
      - title: hold (released)
        conditions:
          - key: action
            value: hold_released
          - key: action_buttons.0
            value: k1
