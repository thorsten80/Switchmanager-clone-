            value: hold
          - key: action_buttons.0
            value: k3
      - title: hold (released)
        conditions:
          - key: action
            value: hold_released
          - key: action_buttons.0
            value: k3
  - x: 38   # power = k4
    y: 222
    width: 57
    height: 58
