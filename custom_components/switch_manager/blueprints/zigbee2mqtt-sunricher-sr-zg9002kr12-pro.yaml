  # ===== Rotary knob (top right) =====
  # No height => rendered as <circle cx=x cy=y r=width>. Center it over the
  # physical knob (top-right) with a radius that clears the side/number buttons.
  - x: 231
    y: 88
    width: 62
    actions:
      - title: press
        conditions:
          - key: action
            value: short_press
          - key: action_buttons.0
            value: knob
      - title: press 2x
        conditions:
          - key: action
