          - key: action_buttons.0
            value: knob
      - title: hold (released)
        conditions:
          - key: action
            value: hold_released
          - key: action_buttons.0
            value: knob
      - title: rotate left
        conditions:
          - key: action
            value: anti_clockwise_rotation
      - title: rotate right
        conditions:
          - key: action
            value: clockwise_rotation
